name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify
        run: composer verify

  demo-round-trip:
    name: Demo round-trip (${{ matrix.demo }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - demo: tasks
            files: "app/Tasks routes/tasks.php resources/views/tasks database/migrations/tasks database/seeds/tasks tests/Tasks"
          - demo: contacts
            files: "app/Contacts routes/contacts.php resources/views/contacts database/migrations/contacts database/seeds/contacts tests/Contacts public/assets/css/contacts-tabulator.css public/assets/js/contacts-tabulator.js public/assets/vendor/tabulator"
          - demo: notas
            files: "app/Notas routes/notas.php resources/views/notas database/migrations/notas database/seeds/notas tests/Notas"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install demo
        run: composer demo:${{ matrix.demo }}:install

      # PHPStan corre con el demo instalado. La suite de installer lo repone
      # tras sus pruebas de rollback, así que el remove de abajo sí lo quita.
      - name: PHPStan with demo
        run: composer phpstan

      - name: Test with demo
        run: composer test

      - name: Remove demo
        run: composer demo:${{ matrix.demo }}:remove

      - name: Test after removal
        run: composer test

      - name: Assert no demo residue
        run: |
          for path in ${{ matrix.files }}; do
            if [ -e "$path" ]; then
              echo "Residuo del demo: $path"
              exit 1
            fi
          done
